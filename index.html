<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="refresh" content="3600">

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;
}

/* Área principal */
#player {
    position: relative;

    width: 100vw;
    height: 100vh;

    background: #000;
}

/* Imagem */
img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

/* Área dos controles */
#controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 90px;

    display: flex;
    align-items: flex-end;
    justify-content: flex-end;

    padding: 0 25px 20px;

    box-sizing: border-box;

    background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.65)
    );

    opacity: 0;

    transition: opacity 0.25s ease;

    pointer-events: none;
}

/* Quando os controles estiverem ativos */
#player.controls-visible #controls {
    opacity: 1;

    pointer-events: auto;
}

/* Botão de tela cheia */
#fullscreenBtn {
    width: 58px;
    height: 48px;

    border: none;
    border-radius: 5px;

    background: rgba(30, 30, 30, 0.85);

    color: white;

    font-size: 27px;
    line-height: 48px;

    cursor: pointer;

    outline: none;
}

/* Destaque do botão */
#fullscreenBtn:focus,
#fullscreenBtn:hover {
    background: rgba(255, 255, 255, 0.25);

    transform: scale(1.05);
}

/* Tela cheia */
#player:fullscreen {
    width: 100vw;
    height: 100vh;
}

/* Compatibilidade Samsung/WebKit */
#player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
}

</style>
</head>

<body>

<div id="player">

    <!-- IMAGEM -->
    <img src="logo.png?v=1" alt="Imagem">

    <!-- CONTROLES -->
    <div id="controls">

        <button
            id="fullscreenBtn"
            type="button"
            aria-label="Tela cheia">
            ⛶
        </button>

    </div>

</div>


<script>

const player = document.getElementById("player");
const fullscreenBtn = document.getElementById("fullscreenBtn");

let hideControlsTimer;


/*
 * Mostra os controles
 */
function showControls() {

    player.classList.add("controls-visible");

    clearTimeout(hideControlsTimer);

    hideControlsTimer = setTimeout(() => {

        player.classList.remove("controls-visible");

    }, 3000);
}


/*
 * Entra em tela cheia
 */
function enterFullscreen() {

    const request =
        player.requestFullscreen ||
        player.webkitRequestFullscreen;

    if (request) {

        request.call(player);

    }
}


/*
 * Sai da tela cheia
 */
function exitFullscreen() {

    const exit =
        document.exitFullscreen ||
        document.webkitExitFullscreen;

    if (exit) {

        exit.call(document);

    }
}


/*
 * Botão de tela cheia
 */
fullscreenBtn.addEventListener("click", function () {

    if (
        document.fullscreenElement ||
        document.webkitFullscreenElement
    ) {

        exitFullscreen();

    } else {

        enterFullscreen();

    }

    showControls();

});


/*
 * Movimento do mouse / Air Mouse
 * Mostra os controles
 */
document.addEventListener("mousemove", function () {

    showControls();

});


/*
 * Alguns controles remotos usam
 * eventos de pointer
 */
document.addEventListener("pointermove", function () {

    showControls();

});


/*
 * Suporte a toque
 */
document.addEventListener("touchstart", function () {

    showControls();

});


/*
 * Atualiza o botão conforme
 * o estado da tela cheia
 */
function updateFullscreenButton() {

    const fullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    if (fullscreen) {

        fullscreenBtn.innerHTML = "⛶";

        fullscreenBtn.setAttribute(
            "aria-label",
            "Sair da tela cheia"
        );

    } else {

        fullscreenBtn.innerHTML = "⛶";

        fullscreenBtn.setAttribute(
            "aria-label",
            "Tela cheia"
        );

    }

}


/*
 * Eventos de tela cheia
 */
document.addEventListener(
    "fullscreenchange",
    updateFullscreenButton
);

document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButton
);


/*
 * Permite usar o botão pelo
 * controle remoto
 */
fullscreenBtn.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" ||
        event.key === " " ||
        event.keyCode === 13 ||
        event.keyCode === 32
    ) {

        event.preventDefault();

        fullscreenBtn.click();

    }

});


/*
 * Começa com os controles escondidos
 */
player.classList.remove("controls-visible");

</script>

</body>
</html>
