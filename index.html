<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;

    overflow: hidden;

}

#player {

    position: relative;

    width: 100vw;
    height: 100vh;

    background: #000;

}

#video {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    background: #000;

}

#controls {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 90px;

    display: flex;

    align-items: flex-end;

    justify-content: flex-end;

    padding: 0 25px 20px;

    box-sizing: border-box;

    background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.65)
    );

    opacity: 0;

    transition: opacity 0.25s ease;

    pointer-events: none;

}

#player.controls-visible #controls {

    opacity: 1;

    pointer-events: auto;

}

#fullscreenBtn {

    width: 58px;
    height: 48px;

    border: none;

    border-radius: 5px;

    background: rgba(30, 30, 30, 0.85);

    color: #fff;

    font-size: 27px;

    line-height: 48px;

    cursor: pointer;

    outline: none;

}

#fullscreenBtn:hover,
#fullscreenBtn:focus {

    background: rgba(255, 255, 255, 0.25);

    transform: scale(1.05);

}


/* =====================================================
   TELA DE CARREGAMENTO
   ===================================================== */

#loading {

    position: absolute;

    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: #000;

    color: #fff;

    font-family: Arial, sans-serif;

    font-size: 22px;

}

#loading.hidden {

    display: none;

}

#loadingText {

    margin-bottom: 20px;

}

#loadingBar {

    width: 300px;

    height: 6px;

    background: #333;

    border-radius: 3px;

    overflow: hidden;

}

#loadingProgress {

    width: 0%;

    height: 100%;

    background: #fff;

    transition: width 0.2s linear;

}

</style>

</head>


<body>


<div id="player">


    <div id="loading">

        <div id="loadingText">
            Carregando vídeo...
        </div>

        <div id="loadingBar">

            <div id="loadingProgress"></div>

        </div>

    </div>


    <video
        id="video"
        muted
        loop
        playsinline
        preload="auto">
    </video>


    <div id="controls">

        <button
            id="fullscreenBtn"
            type="button"
            aria-label="Tela cheia">

            ⛶

        </button>

    </div>


</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

var VIDEO_FILE = "video_tizen.mp4";

/*
 * Nome do cache.
 *
 * Se você trocar o vídeo no futuro,
 * pode simplesmente mudar v1 para v2.
 */

var CACHE_NAME = "video-cache-v1";


/* =====================================================
   ELEMENTOS
   ===================================================== */

var player =
    document.getElementById("player");

var video =
    document.getElementById("video");

var fullscreenBtn =
    document.getElementById("fullscreenBtn");

var loading =
    document.getElementById("loading");

var loadingText =
    document.getElementById("loadingText");

var loadingProgress =
    document.getElementById("loadingProgress");


/* =====================================================
   URL ABSOLUTA DO VÍDEO
   ===================================================== */

var VIDEO_URL =
    new URL(
        VIDEO_FILE,
        window.location.href
    ).href;


/* =====================================================
   URL BLOB ATUAL
   ===================================================== */

var currentBlobUrl = null;


/* =====================================================
   MOSTRAR / ESCONDER CARREGAMENTO
   ===================================================== */

function showLoading(text) {

    loadingText.textContent = text;

    loadingProgress.style.width = "0%";

    loading.classList.remove("hidden");

}


function hideLoading() {

    loading.classList.add("hidden");

}


/* =====================================================
   ATUALIZAR PROGRESSO
   ===================================================== */

function updateProgress(percent) {

    if (percent < 0) {
        percent = 0;
    }

    if (percent > 100) {
        percent = 100;
    }

    loadingProgress.style.width =
        percent + "%";

}


/* =====================================================
   CRIAR BLOB URL
   ===================================================== */

function useBlob(blob) {

    /*
     * Libera o Blob URL anterior.
     */

    if (currentBlobUrl) {

        try {

            URL.revokeObjectURL(
                currentBlobUrl
            );

        } catch (e) {}

    }


    /*
     * Cria uma URL local:
     *
     * blob:https://...
     */

    currentBlobUrl =
        URL.createObjectURL(blob);


    /*
     * O vídeo deixa de apontar
     * diretamente para o GitHub.
     */

    video.src = currentBlobUrl;

    video.load();

}


/* =====================================================
   BAIXAR E ARMAZENAR NO CACHE
   ===================================================== */

async function downloadVideo(cache) {

    showLoading(
        "Baixando vídeo..."
    );


    /*
     * Faz o download completo.
     */

    var response =
        await fetch(
            VIDEO_URL,
            {
                method: "GET",
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "Erro HTTP " +
            response.status
        );

    }


    /*
     * Converte o download inteiro
     * para Blob.
     */

    var blob =
        await response.blob();


    /*
     * Verifica se realmente
     * recebemos um vídeo.
     */

    if (!blob || blob.size === 0) {

        throw new Error(
            "Vídeo vazio."
        );

    }


    updateProgress(90);


    /*
     * Guarda a resposta original
     * no Cache Storage.
     *
     * Assim não será necessário
     * baixar novamente na próxima vez.
     */

    await cache.put(
        VIDEO_URL,
        response.clone()
    );


    updateProgress(100);


    return blob;

}


/* =====================================================
   CARREGAR VÍDEO
   ===================================================== */

async function loadVideo() {

    try {

        /*
         * Abre o cache.
         */

        var cache =
            await caches.open(
                CACHE_NAME
            );


        /*
         * Procura o vídeo no cache.
         */

        var cachedResponse =
            await cache.match(
                VIDEO_URL
            );


        if (cachedResponse) {

            /*
             * Encontrado!
             *
             * Não fazemos download.
             */

            showLoading(
                "Carregando vídeo..."
            );

            updateProgress(100);


            var cachedBlob =
                await cachedResponse.blob();


            if (
                !cachedBlob ||
                cachedBlob.size === 0
            ) {

                throw new Error(
                    "Cache inválido."
                );

            }


            useBlob(
                cachedBlob
            );

        } else {

            /*
             * Primeira execução.
             */

            var downloadedBlob =
                await downloadVideo(
                    cache
                );


            useBlob(
                downloadedBlob
            );

        }


        /*
         * Aguarda o navegador
         * estar pronto para reproduzir.
         */

        if (
            video.readyState >= 3
        ) {

            startVideo();

        } else {

            video.addEventListener(
                "canplay",
                function onCanPlay() {

                    video.removeEventListener(
                        "canplay",
                        onCanPlay
                    );

                    startVideo();

                }
            );

        }


    } catch (error) {

        console.log(
            "Erro ao carregar vídeo:",
            error
        );


        loadingText.textContent =
            "Erro ao carregar vídeo";


        /*
         * Pequena tentativa de
         * recuperação.
         */

        setTimeout(
            function() {

                loadVideo();

            },
            3000
        );

    }

}


/* =====================================================
   INICIAR VÍDEO
   ===================================================== */

function startVideo() {

    video.muted = true;


    var promise =
        video.play();


    if (
        promise !== undefined
    ) {

        promise.catch(
            function(error) {

                console.log(
                    "Autoplay bloqueado:",
                    error
                );

            }
        );

    }


    hideLoading();

}


/* =====================================================
   ERRO DE VÍDEO
   ===================================================== */

video.addEventListener(
    "error",
    function() {

        console.log(
            "Erro do elemento video:",
            video.error
        );

    }
);


/* =====================================================
   CONTROLES
   ===================================================== */

var hideControlsTimer;


function showControls() {

    player.classList.add(
        "controls-visible"
    );


    clearTimeout(
        hideControlsTimer
    );


    hideControlsTimer =
        setTimeout(
            function() {

                player.classList.remove(
                    "controls-visible"
                );

            },
            3000
        );

}


document.addEventListener(
    "mousemove",
    showControls
);


document.addEventListener(
    "pointermove",
    showControls
);


document.addEventListener(
    "touchstart",
    showControls
);


/* =====================================================
   TELA CHEIA
   ===================================================== */

function enterFullscreen() {

    var request =
        player.requestFullscreen ||
        player.webkitRequestFullscreen;


    if (request) {

        request.call(player);

    }

}


function exitFullscreen() {

    var exit =
        document.exitFullscreen ||
        document.webkitExitFullscreen;


    if (exit) {

        exit.call(document);

    }

}


fullscreenBtn.addEventListener(
    "click",
    function() {

        if (
            document.fullscreenElement ||
            document.webkitFullscreenElement
        ) {

            exitFullscreen();

        } else {

            enterFullscreen();

        }

        showControls();

    }
);


fullscreenBtn.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === " " ||
            event.keyCode === 13 ||
            event.keyCode === 32
        ) {

            event.preventDefault();

            fullscreenBtn.click();

        }

    }
);


/* =====================================================
   ESTADO DA TELA CHEIA
   ===================================================== */

function updateFullscreenButton() {

    var fullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;


    if (fullscreen) {

        fullscreenBtn.setAttribute(
            "aria-label",
            "Sair da tela cheia"
        );

    } else {

        fullscreenBtn.setAttribute(
            "aria-label",
            "Tela cheia"
        );

    }

}


document.addEventListener(
    "fullscreenchange",
    updateFullscreenButton
);


document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButton
);


/* =====================================================
   LIMPEZA DO BLOB AO SAIR
   ===================================================== */

window.addEventListener(
    "beforeunload",
    function() {

        if (currentBlobUrl) {

            try {

                URL.revokeObjectURL(
                    currentBlobUrl
                );

            } catch (e) {}

        }

    }
);


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

player.classList.remove(
    "controls-visible"
);


/*
 * Começa o processo.
 */

loadVideo();

</script>

</body>

</html>
